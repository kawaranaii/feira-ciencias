<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste de câmera</title>

    <style>

        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #mensagem {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;

            padding: 15px;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            font-family: sans-serif;
            text-align: center;

            border-radius: 10px;
        }

    </style>

</head>

<body>

    <video
        id="camera"
        autoplay
        playsinline
    ></video>

    <div id="mensagem">
        Pedindo acesso à câmera...
    </div>

    <script>

        const video =
            document.getElementById("camera");

        const mensagem =
            document.getElementById("mensagem");


        async function iniciarCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: "environment"
                        },

                        audio: false
                    });

                video.srcObject = stream;

                mensagem.textContent =
                    "Câmera funcionando 📷";

            } catch (erro) {

                mensagem.textContent =
                    "Não consegui acessar a câmera: " +
                    erro.message;

            }

        }

        iniciarCamera();

    </script>

</body>

</html>
